<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 190" width="580" height="190" role="img" aria-label="hinoki: Typed Python APIs with a Rust core, and architecture rules you can check.">
<defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#8b6cf0"/><stop offset="1" stop-color="#e8c39e"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#e8c39e" stop-opacity=".28"/><stop offset="1" stop-color="#e8c39e" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="1" y="1" width="578" height="188" rx="18"/></clipPath>
</defs>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.name{font-size:26px;font-weight:700;fill:#f1eeff;letter-spacing:-.4px}
.desc{font-size:15px;fill:#9d98c8}
.tag{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.6px}
.num{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;fill:#9d98c8}
.arrow{fill:none;stroke:#b9a4ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:nudge 2.4s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 4.5s ease-in-out 0.00s infinite alternate}
.glow{animation:pulse 5s ease-in-out 0.0s infinite alternate}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
@keyframes bar{from{transform:scaleX(.18)}to{transform:scaleX(1)}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.arrow,.bar,.glow{animation:none}}
</style>
<g clip-path="url(#clip)">
<rect width="580" height="190" fill="#17142e"/>
<rect class="glow" width="580" height="190" fill="url(#glow)"/>
<rect class="bar" x="0" y="0" width="580" height="3" fill="url(#bar)"/>
</g>
<rect x="1" y="1" width="578" height="188" rx="18" fill="none" stroke="#2b2650" stroke-width="1.5"/>
<text class="num" x="28" y="38">01</text>
<text class="name" x="28" y="76">hinoki</text>
<text class="desc" x="28" y="102">Typed Python APIs with a Rust core,</text>
<text class="desc" x="28" y="122">and architecture rules you can check.</text>
<rect x="28" y="138" width="66" height="26" rx="13" fill="#241f4a"/><text class="tag" x="61" y="155.5" text-anchor="middle" fill="#b9a4ff">PYTHON</text><rect x="102.4" y="138" width="52" height="26" rx="13" fill="#241f4a"/><text class="tag" x="128" y="155.5" text-anchor="middle" fill="#b9a4ff">RUST</text><rect x="162.0" y="138" width="89" height="26" rx="13" fill="#241f4a"/><text class="tag" x="206" y="155.5" text-anchor="middle" fill="#e8c39e">PRE-ALPHA</text>
<path class="arrow" d="M534 38 L552 20 M538 20 H552 V34"/>
</svg>
