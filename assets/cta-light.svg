<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 64" width="420" height="64" role="img" aria-label="Open the portfolio at caspel.dev">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7a55c4"/><stop offset="1" stop-color="#6d4fc2"/></linearGradient></defs>
<style>
.t{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:18px;font-weight:700;fill:#1d1a24}
.u{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:600;fill:#625c85;letter-spacing:.4px}
.a{fill:none;stroke:#6d4fc2;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:nudge 2.4s ease-in-out infinite}
.edge{stroke-dasharray:6 8;animation:march 3s linear infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes march{to{stroke-dashoffset:-56}}
@media (prefers-reduced-motion:reduce){.a,.edge{animation:none}}
</style>
<rect x="1" y="1" width="418" height="62" rx="31" fill="#efeaff"/>
<rect class="edge" x="1" y="1" width="418" height="62" rx="31" fill="none" stroke="url(#g)" stroke-width="2"/>
<circle cx="32" cy="32" r="18" fill="#ffffff" stroke="#ddd5f5"/>
<g transform="translate(13.5 18.3) scale(.72)"><path d="M22.5 13.5A8.5 8.5 0 1 0 22.5 25.5" fill="none" stroke="#6d4fc2" stroke-width="4.2" stroke-linecap="round"/><rect x="26.5" y="26" width="9" height="4.4" rx="1.2" fill="#a8742f"/></g>
<text class="t" x="64" y="30">View my portfolio</text>
