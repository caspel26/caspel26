<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hi, I'm Giuseppe. Software Engineer at Namirial Group">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#100e24"/></linearGradient>
<linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#8b6cf0"/><stop offset=".5" stop-color="#b9a4ff"/><stop offset="1" stop-color="#e8c39e"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="clip"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.hi{font-size:60px;font-weight:700;fill:#f1eeff;letter-spacing:-1.5px}
.sub{font-size:22px;fill:#9d98c8}
.role{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:20px;fill:#b9a4ff;opacity:0;animation:role 12s infinite}
.blob{filter:url(#blur);opacity:0.55}
.b1{animation:drift1 14s ease-in-out infinite alternate}
.b2{animation:drift2 17s ease-in-out infinite alternate}
.b3{animation:drift1 19s ease-in-out infinite alternate-reverse}
.sweep{transform-box:fill-box;transform-origin:left;animation:sweep 5s ease-in-out infinite alternate}
.fl{animation:bob 6s ease-in-out infinite alternate;animation-delay:inherit}
.pn{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:15px;font-weight:600;fill:#f1eeff}
.pt{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:1px;fill:#9d98c8}
@keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
@keyframes role{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes drift1{to{transform:translate(120px,40px)}}
@keyframes drift2{to{transform:translate(-140px,-30px)}}
@keyframes sweep{from{transform:scaleX(.25)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.role,.b1,.b2,.b3,.sweep,.fl{animation:none}.role:first-of-type{opacity:1}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="300" fill="url(#bg)"/>
<circle class="blob b1" cx="260" cy="60" r="150" fill="#8b6cf0"/>
<circle class="blob b2" cx="900" cy="250" r="170" fill="#b9a4ff"/>
<circle class="blob b3" cx="1080" cy="40" r="110" fill="#e8c39e"/>
<text class="hi" x="80" y="120">Hi, I'm Giuseppe</text>
<text class="sub" x="80" y="164">Software Engineer @ Namirial Group</text>
<text class="role" style="animation-delay:0s" x="80" y="214">Backend · APIs · developer tools</text><text class="role" style="animation-delay:3s" x="80" y="214">Python · Go · TypeScript</text><text class="role" style="animation-delay:6s" x="80" y="214">AI-first · agentic programming</text><text class="role" style="animation-delay:9s" x="80" y="214">Building Hinoki: Python APIs with a Rust core</text>
<rect class="sweep" x="80" y="240" width="220" height="3" rx="1.5" fill="url(#rule)"/>
<g class="float" style="animation-delay:0.0s" transform="translate(770 44)"><g class="fl"><rect width="340" height="56" rx="14" fill="#17142e" fill-opacity=".78" stroke="#2b2650" stroke-width="1.5"/><circle cx="26" cy="28" r="6" fill="#e8c39e"/><text class="pn" x="46" y="34">hinoki</text><text class="pt" x="314" y="33" text-anchor="end">PYTHON · RUST</text></g></g><g class="float" style="animation-delay:-1.8s" transform="translate(806 122)"><g class="fl"><rect width="340" height="56" rx="14" fill="#17142e" fill-opacity=".78" stroke="#2b2650" stroke-width="1.5"/><circle cx="26" cy="28" r="6" fill="#8b6cf0"/><text class="pn" x="46" y="34">django-ninja-aio-crud</text><text class="pt" x="314" y="33" text-anchor="end">PYTHON</text></g></g><g class="float" style="animation-delay:-3.6s" transform="translate(770 200)"><g class="fl"><rect width="340" height="56" rx="14" fill="#17142e" fill-opacity=".78" stroke="#2b2650" stroke-width="1.5"/><circle cx="26" cy="28" r="6" fill="#b9a4ff"/><text class="pn" x="46" y="34">goninja</text><text class="pt" x="314" y="33" text-anchor="end">GO</text></g></g>
</g>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="21.5" fill="none" stroke="#2b2650" stroke-width="1.5"/>
</svg>
