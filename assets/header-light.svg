<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hi, I'm Giuseppe. Backend engineer: frameworks, APIs and developer tools.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#faf8ff"/></linearGradient>
<linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#7a55c4"/><stop offset=".5" stop-color="#6d4fc2"/><stop offset="1" stop-color="#a8742f"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="clip"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.hi{font-size:60px;font-weight:700;fill:#1d1a24;letter-spacing:-1.5px}
.sub{font-size:22px;fill:#625c85}
.role{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:20px;fill:#6d4fc2;opacity:0;animation:role 12s infinite}
.blob{filter:url(#blur);opacity:0.35}
.b1{animation:drift1 14s ease-in-out infinite alternate}
.b2{animation:drift2 17s ease-in-out infinite alternate}
.b3{animation:drift1 19s ease-in-out infinite alternate-reverse}
.ring{fill:none;stroke:#6d4fc2;stroke-opacity:.16;stroke-width:1.5}
.spin{transform-origin:1010px 150px;animation:spin 90s linear infinite}
.sweep{transform-box:fill-box;transform-origin:left;animation:sweep 5s ease-in-out infinite alternate}
@keyframes role{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes drift1{to{transform:translate(120px,40px)}}
@keyframes drift2{to{transform:translate(-140px,-30px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:scaleX(.25)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.role,.b1,.b2,.b3,.spin,.sweep{animation:none}.role:first-of-type{opacity:1}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="300" fill="url(#bg)"/>
<circle class="blob b1" cx="260" cy="60" r="150" fill="#7a55c4"/>
<circle class="blob b2" cx="900" cy="250" r="170" fill="#6d4fc2"/>
<circle class="blob b3" cx="1080" cy="40" r="110" fill="#a8742f"/>
<g class="spin">
<circle class="ring" cx="1010" cy="150" r="40"/><circle class="ring" cx="1010" cy="150" r="72"/>
<circle class="ring" cx="1010" cy="150" r="104"/><circle class="ring" cx="1010" cy="150" r="136"/>
<circle class="ring" cx="1010" cy="150" r="168"/><circle class="ring" cx="1010" cy="150" r="200"/>
<path class="ring" d="M1010 150 L1210 150" stroke-opacity=".28"/>
</g>
<text class="hi" x="80" y="120">Hi, I'm Giuseppe</text>
<text class="sub" x="80" y="164">Backend engineer · building Hinoki, goninja and django-ninja-aio-crud</text>
<text class="role" style="animation-delay:0s" x="80" y="214">Backend · APIs · developer tools</text><text class="role" style="animation-delay:3s" x="80" y="214">Python · Go · TypeScript</text><text class="role" style="animation-delay:6s" x="80" y="214">AI-first · agentic programming</text><text class="role" style="animation-delay:9s" x="80" y="214">Building Hinoki: Python APIs with a Rust core</text>
<rect class="sweep" x="80" y="240" width="220" height="3" rx="1.5" fill="url(#rule)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="21.5" fill="none" stroke="#ddd5f5" stroke-width="1.5"/>
</svg>
